server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. Behind the host nginx this container only sees plain
    # http on :80, so absolute redirects (e.g. /guides -> /guides/) leaked http:// URLs.
    absolute_redirect off;

    # Unknown URLs get a real 404 (noindex) instead of a soft-200 SPA shell.
    error_page 404 /404.html;
    location = /404.html { internal; add_header X-Robots-Tag "noindex" always; }

    # API requests -> backend (same-origin, no CORS needed).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # LLM previews can take a few seconds
        proxy_buffering off;       # flush streamed preview tokens as they arrive
        proxy_cache off;
    }

    # Server-rendered SEO pages + dynamic sitemap -> backend.
    location /prompt/   { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /category/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /sitemap.xml { proxy_pass http://backend:8000/sitemap.xml; proxy_set_header Host $host; }

    # Server-rendered browse hub + info/policy pages -> backend (crawlable, no JS needed).
    location ~ ^/(browse|about|methodology|source-policy|submit|privacy|terms)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static SEO guide pages (real HTML, served before the SPA fallback).
    location = /guides { return 301 /guides/; }
    location /guides/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # The SPA lives only at "/" (search state is in ?q=). Everything else must be a real
    # static file, otherwise 404 — no catch-all index.html fallback.
    location = / { try_files /index.html =404; }
    location / {
        try_files $uri =404;
    }
}
